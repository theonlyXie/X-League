# Builds an installable APK and attaches it to the run.
#
# This exists because an APK for a React Native app is ~60-100 MB — too large
# to hand over any other way — and because building one otherwise needs a local
# Android SDK or an Expo account. Push, or run it by hand, then download the
# artifact from the run summary.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABIs to build'
        required: false
        default: 'arm64-v8a,armeabi-v7a'
        type: choice
        options:
          - 'arm64-v8a,armeabi-v7a'
          - 'arm64-v8a'
          - 'arm64-v8a,armeabi-v7a,x86,x86_64'
  push:
    branches: [main, 'claude/**']
    # The admin dashboard is a separate deployment with its own workflow;
    # a change there cannot affect the APK, so it should not rebuild one.
    paths-ignore: ['**.md', 'supabase/**', 'admin/**']

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # AGP 8.x needs 17 or newer; 17 is the version Expo tests against.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Typecheck, plus the check that catches what a typecheck cannot: a
      # string present in one language and missing from the other renders
      # `undefined` and never fails to compile.
      - name: Check
        run: npm run check

      # The native project is generated rather than committed, so app.json stays
      # the single source of Android configuration.
      - name: Generate the native project
        run: npx expo prebuild --platform android --clean

      # No `env:` block here, deliberately. It used to pass four
      # `${{ vars.* }}` through, and those repository variables were never set,
      # so every one arrived as an empty string — which is *set*, as far as the
      # env loader is concerned, and an already-set variable is never overridden
      # by a .env file. The committed `.env.production` was read and then
      # ignored, and every APK CI has ever produced shipped with no database:
      # it installed, opened, showed no cups, and offered no way to sign in.
      # The configuration is `.env.production`; nothing here may shadow it.
      - name: Build the APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=${{ github.event.inputs.abi || 'arm64-v8a,armeabi-v7a' }}

      # A build with no database still compiles, still installs, and still opens
      # — on showcase data, where signing up as a player or a venue answers
      # "This build has no database configured." That is the worst kind of
      # failure: it looks like a working app. The check is against the APK
      # rather than against the environment, because what matters is what the
      # bundle ended up containing.
      # This guard existed for exactly the failure above and did not catch it,
      # because `grep supabase.co` matches `supabase.collapsedetents` — a
      # string Reanimated puts in every bundle. It passed on a bundle that had
      # no database in it at all. It now looks for the values this repository
      # actually configures, read out of `.env.production` rather than typed
      # here, so the check cannot drift away from the thing it checks.
      - name: Refuse to ship a build with no database
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -p "$APK" assets/index.android.bundle > /tmp/bundle.hbc
          URL=$(grep -oP '(?<=^EXPO_PUBLIC_SUPABASE_URL=).*' .env.production)
          KEY=$(grep -oP '(?<=^EXPO_PUBLIC_SUPABASE_ANON_KEY=).*' .env.production)
          fail=0
          grep -qF "$URL" /tmp/bundle.hbc || { echo "::error::The Supabase URL is not in the bundle."; fail=1; }
          grep -qF "$KEY" /tmp/bundle.hbc || { echo "::error::The Supabase key is not in the bundle."; fail=1; }
          if [ "$fail" = 1 ]; then
            echo "::error::This APK would install, open, show no cups and offer nobody a way to sign in."
            exit 1
          fi
          echo "Database configured in the bundle: URL and key both present."

      - name: Name it after the commit
        id: name
        run: echo "apk=x-league-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      - name: Report what was built
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "### APK built" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging "$APK" \
            | grep -E "^package|^application-label:|uses-permission" >> "$GITHUB_STEP_SUMMARY" || true
          ls -lh "$APK" | awk '{print "size: " $5}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Signed with the debug keystore — installable, not publishable." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
