# Runs the SQL acceptance suites against a real Postgres.
#
# The product's core promises are database properties rather than application
# behaviour — one pitch-hour has one owner, a venue's staff reach only their own
# venues, a card cannot be rated into existence by one friend. None of that is
# testable from the app, and all of it is testable here, so this runs on every
# change to `supabase/`.
#
# `bootstrap.sh` supplies the small `auth` shim Supabase provides and a bare
# Postgres does not: an auth.users table, `auth.uid()` reading the JWT claim
# PostgREST sets, and the anon/authenticated roles the grants name.
name: Database

on:
  push:
    branches: [main, 'claude/**', 'xie/**']
    paths: &watched
      - 'supabase/**'
      # The clients are watched too, because `check-rpc.mjs` below compares what
      # they call against what the schema has, and a change to either half can
      # break that agreement.
      - 'src/**'
      - 'app/**'
      - 'admin/**'
      - 'scripts/check-rpc.mjs'
      - '.github/workflows/database.yml'
  pull_request:
    paths: *watched
  workflow_dispatch:

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # The extension the exclusion constraint needs (btree_gist) ships with
        # the stock image; nothing else is required.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5433
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      # Every suite resolves slot times in the venue's own zone, and Egypt
      # observes DST. Pinning the runner's zone keeps a failure a real failure
      # rather than an artefact of the runner being in UTC.
      TZ: Africa/Cairo

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run every suite
        run: supabase/tests/run_all.sh

      # A refusal added to a migration is English until somebody translates it,
      # and this is the workflow that runs when migrations change — so it is the
      # one that has to notice. Needs no database, only the files.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Every refusal has an Arabic translation
        run: node scripts/check-reasons.mjs

      # The seam between the two halves of this product: TypeScript that names
      # a function and arguments, and a schema that either has them or does not.
      # `tsc` cannot see across it and the SQL suites never make the call the app
      # makes, which is how sign-up stayed broken for ten days. `run_all.sh`
      # above has already built the schema this reads.
      - name: Every RPC the clients call exists
        run: node scripts/check-rpc.mjs

      - name: Summarise
        if: always()
        run: |
          echo "### SQL suites" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Booking spine, RBAC, card, squad, matches, cancellation," >> "$GITHUB_STEP_SUMMARY"
          echo "messaging, tournaments, clubs, entry money, honours, and the" >> "$GITHUB_STEP_SUMMARY"
          echo "access surface — plus every refusal having Arabic copy." >> "$GITHUB_STEP_SUMMARY"
